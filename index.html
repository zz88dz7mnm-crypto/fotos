<!-- muro -->
<title>Muro Golden Coast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --void:#0d0f0e;
    --sand:#e9e4da;
    --card:#fbf9f5;
    --ink:#2a2e2b;
    --muted:#7c8177;
    --line:#cfc8b9;
    --sol:#c07a1e;
    --sol-soft:rgba(217,143,43,.14);
    --display:"Bricolage Grotesque",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --sand:#1a1d1b; --card:#282c29; --ink:#e8e4da;
      --muted:#949a8e; --line:#3a403b;
      --sol:#e5a84e; --sol-soft:rgba(229,168,78,.16);
    }
  }
  :root[data-theme="dark"]{
    --sand:#1a1d1b; --card:#282c29; --ink:#e8e4da;
    --muted:#949a8e; --line:#3a403b;
    --sol:#e5a84e; --sol-soft:rgba(229,168,78,.16);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--void);color:var(--ink);font-family:var(--mono)}

  /* ============================================================
     EL MURO — nada más que fotos, de un costado al otro
     ============================================================ */
  /* cada foto entera, con su proporcion intacta y sin recortes.
     Las filas se llenan hasta donde entra: si sobra un pedazo a la
     derecha, se deja — antes que cortar una foto */
  #wall{
    display:flex;
    flex-wrap:wrap;
    line-height:0;           /* mata el hueco de línea base entre imágenes */
  }
  #wall img{
    display:block;
    height:clamp(150px,17vw,260px);
    width:auto;
    flex:0 0 auto;           /* sin estirar: cada foto entera, con su proporcion */
    margin:0;
    border:0;
  }
  @media (max-width:640px){ #wall img{height:clamp(120px,28vw,190px)} }

  /* el muro ocupa todo; la carga vive aparte */
  body[data-mode="muro"]  #uploader{display:none}
  body[data-mode="carga"] #wall{display:none}
  body[data-mode="carga"] #vacio{display:none}

  #vacio{
    min-height:100vh;display:grid;place-items:center;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#4a4f4b;
  }
  #vacio[hidden]{display:none}

  /* ============================================================
     LA CARGA — la otra página
     ============================================================ */
  #uploader{
    min-height:100vh;display:grid;place-items:center;
    background:var(--sand);padding:40px 24px;
  }
  .box{width:min(560px,100%);text-align:center}
  .eyebrow{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);margin:0 0 22px;
  }
  h1{
    font-family:var(--display);font-size:clamp(30px,5vw,46px);
    font-weight:800;letter-spacing:-.03em;line-height:1.02;
    margin:0 0 16px;color:var(--ink);text-wrap:balance;
  }
  .lede{
    font-family:var(--display);font-weight:400;font-size:16px;line-height:1.6;
    color:var(--muted);margin:0 auto 36px;max-width:44ch;
  }
  .drop{
    display:flex;align-items:center;justify-content:center;gap:14px;
    width:100%;cursor:pointer;font:inherit;color:var(--ink);
    background:transparent;border:1.5px dashed var(--line);border-radius:2px;
    padding:34px 28px;transition:border-color .2s ease,background .2s ease;
  }
  .drop:hover,.drop.over{border-color:var(--sol);background:var(--sol-soft)}
  .drop:focus-visible{outline:2px solid var(--sol);outline-offset:3px}
  .drop .dot{
    width:32px;height:32px;border-radius:50%;flex:none;
    border:1.5px solid var(--sol);color:var(--sol);
    display:grid;place-items:center;font-size:17px;line-height:1;
  }
  .drop .t{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.01em}
  input[type=file]{display:none}

  .status{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--sol);min-height:18px;margin:20px 0 0;
  }
  .note{font-size:11px;letter-spacing:.08em;color:var(--muted);margin:10px 0 0;line-height:1.9}
  .note a{color:var(--sol)}

  /* acceso discreto a la carga desde el muro, por si el link con #subir no toma */
  #toCarga{
    position:fixed;right:14px;bottom:14px;z-index:10;
    width:38px;height:38px;border-radius:50%;
    border:1px solid rgba(233,228,218,.28);background:rgba(13,15,14,.55);
    color:rgba(233,228,218,.85);font-size:19px;line-height:1;cursor:pointer;
    opacity:0;transition:opacity .25s ease;backdrop-filter:blur(6px);
  }
  #toCarga:hover,#toCarga:focus-visible{opacity:1;outline:none}
  body[data-mode="muro"]:hover #toCarga{opacity:.28}
  body[data-mode="carga"] #toCarga{display:none}

  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<div id="wall"></div>

<div id="vacio">el muro está vacío</div>

<artifact-local>
  <div id="uploader">
    <div class="box">
      <p class="eyebrow">Golden Coast</p>
      <h1>Sumá una foto al muro</h1>
      <p class="lede">
        Sale revelada sola con la vibra de siempre y se pega al muro.
        No hay nada que elegir ni que editar.
      </p>
      <button type="button" class="drop" id="drop">
        <span class="dot" aria-hidden="true">+</span>
        <span class="t">Elegí una foto o arrastrala acá</span>
      </button>
      <input type="file" id="file" accept="image/*" multiple>
      <p class="status" id="status"></p>
      <p class="note" id="note"></p>
    </div>
  </div>
</artifact-local>

<button type="button" id="toCarga" title="Sumar una foto" aria-label="Sumar una foto">+</button>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const wallEl = $("wall"), vacioEl = $("vacio"), dropEl = $("drop"),
        fileEl = $("file"), statusEl = $("status"), noteEl = $("note"),
        toCarga = $("toCarga");

  const MAX_EDGE = 1200, QUALITY = 0.74;
  let shared = null, readOnly = false;

  /* ---- qué página es esta: el muro o la carga ---- */
  function modo(){
    // sirve la ruta (/subir en Vercel), la query (?subir) y el fragmento (#subir)
    const url = (location.pathname || "") + (location.search || "") + (location.hash || "");
    return /(^|[\/?#&])(subir|cargar)\b/i.test(url) ? "carga" : "muro";
  }
  function aplicarModo(){ document.body.dataset.mode = modo(); }
  aplicarModo();
  window.addEventListener("hashchange", aplicarModo);
  toCarga.addEventListener("click", () => {
    location.hash = "subir";
    aplicarModo();
  });

  /* ============================================================
     EL FILTRO
     ============================================================ */
  const CH = {
    r:{ lift:0.030, gain:1.000, gamma:1.00 },
    g:{ lift:0.028, gain:0.994, gamma:1.00 },
    b:{ lift:0.055, gain:0.968, gamma:0.99 }
  };
  const SHOULDER = 0.78, SHOULDER_K = 1.35, CONTRAST = 0.96;

  function buildLUT(c){
    const lut = new Float32Array(256), norm = 1 - Math.exp(-SHOULDER_K);
    for (let i = 0; i < 256; i++){
      let x = Math.pow(i/255, c.gamma);
      if (x > SHOULDER){
        const t = (x - SHOULDER)/(1 - SHOULDER);
        x = SHOULDER + (1 - SHOULDER)*(1 - Math.exp(-SHOULDER_K*t))/norm;
      }
      x = (x - 0.5)*CONTRAST + 0.5;
      x = c.lift + (c.gain - c.lift)*x;
      lut[i] = x < 0 ? 0 : x > 1 ? 1 : x;
    }
    return lut;
  }
  const LR = buildLUT(CH.r), LG = buildLUT(CH.g), LB = buildLUT(CH.b);

  function grade(data){
    const WB_R = 1.012, WB_G = 1.004, WB_B = 0.982;
    for (let i = 0; i < data.length; i += 4){
      let r = LR[Math.min(255,(data[i]  *WB_R)|0)];
      let g = LG[Math.min(255,(data[i+1]*WB_G)|0)];
      let b = LB[Math.min(255,(data[i+2]*WB_B)|0)];
      const L = 0.2126*r + 0.7152*g + 0.0722*b;
      const sw = (1-L)*(1-L), hw = L*L, mw = 4*L*(1-L);
      r += -0.016*sw + 0.038*hw + 0.009*mw;
      g +=  0.005*sw + 0.013*hw + 0.003*mw;
      b +=  0.024*sw - 0.034*hw - 0.007*mw;
      const sat = (b > r && b > g) ? 0.98 : 0.90;
      const lum = 0.2126*r + 0.7152*g + 0.0722*b;
      r = lum + (r-lum)*sat; g = lum + (g-lum)*sat; b = lum + (b-lum)*sat;
      data[i]   = r < 0 ? 0 : r > 1 ? 255 : r*255;
      data[i+1] = g < 0 ? 0 : g > 1 ? 255 : g*255;
      data[i+2] = b < 0 ? 0 : b > 1 ? 255 : b*255;
    }
  }

  function halation(ctx, w, h){
    const src = ctx.getImageData(0,0,w,h), hi = ctx.createImageData(w,h);
    const s = src.data, d = hi.data;
    for (let i = 0; i < s.length; i += 4){
      const lum = (0.2126*s[i] + 0.7152*s[i+1] + 0.0722*s[i+2])/255;
      const m = lum > 0.74 ? (lum - 0.74)/0.26 : 0;
      d[i] = 255*m; d[i+1] = 140*m; d[i+2] = 60*m; d[i+3] = 255;
    }
    const tmp = document.createElement("canvas");
    tmp.width = w; tmp.height = h;
    tmp.getContext("2d").putImageData(hi,0,0);
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    ctx.globalAlpha = 0.20;
    ctx.filter = `blur(${Math.max(4, Math.round(Math.min(w,h)*0.016))}px)`;
    ctx.drawImage(tmp,0,0);
    ctx.restore(); ctx.filter = "none";
  }

  function sunTint(ctx, w, h){
    ctx.save();
    ctx.globalCompositeOperation = "soft-light";
    const g = ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,"rgba(232,163,61,.24)");
    g.addColorStop(1,"rgba(193,85,47,.14)");
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    ctx.restore();
  }

  function grainVignette(data, w, h){
    const cx = w/2, cy = h/2, maxR2 = cx*cx + cy*cy;
    for (let y = 0; y < h; y++){
      const dy = y - cy, dy2 = dy*dy;
      for (let x = 0; x < w; x++){
        const i = (y*w + x)*4;
        let r = data[i], g = data[i+1], b = data[i+2];
        const dx = x - cx, rr = (dx*dx + dy2)/maxR2, v = 1 - 0.13*rr*rr;
        r *= v; g *= v; b *= v;
        const lum = (0.2126*r + 0.7152*g + 0.0722*b)/255;
        const n = (Math.random() - 0.5) * 6.2 * (1 + 1.6*(1 - lum));
        r += n; g += n; b += n;
        data[i]   = r < 0 ? 0 : r > 255 ? 255 : r;
        data[i+1] = g < 0 ? 0 : g > 255 ? 255 : g;
        data[i+2] = b < 0 ? 0 : b > 255 ? 255 : b;
      }
    }
  }

  async function revelar(file){
    let bmp;
    try { bmp = await createImageBitmap(file,{imageOrientation:"from-image"}); }
    catch {
      bmp = await new Promise((res,rej)=>{
        const im = new Image();
        im.onload = ()=>res(im); im.onerror = rej;
        im.src = URL.createObjectURL(file);
      });
    }
    const scale = Math.min(1, MAX_EDGE/Math.max(bmp.width,bmp.height));
    const w = Math.max(1,Math.round(bmp.width*scale));
    const h = Math.max(1,Math.round(bmp.height*scale));
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    const ctx = cv.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(bmp,0,0,w,h);

    let img = ctx.getImageData(0,0,w,h);
    grade(img.data);
    ctx.putImageData(img,0,0);
    halation(ctx,w,h);
    sunTint(ctx,w,h);
    img = ctx.getImageData(0,0,w,h);
    grainVignette(img.data,w,h);
    ctx.putImageData(img,0,0);
    return cv.toDataURL("image/jpeg", QUALITY);
  }

  /* ============================================================
     PEGAR AL MURO
     ============================================================ */
  function nuevaFoto(dataUrl){
    const img = document.createElement("img");
    img.src = dataUrl;
    img.alt = "";
    img.loading = "lazy";
    return img;
  }

  const LS = "goldencoast-muro";
  const leerLocal = () => { try { return JSON.parse(localStorage.getItem(LS)) || []; } catch { return []; } };
  function guardarLocal(){
    try { localStorage.setItem(LS, JSON.stringify([...wallEl.children].map(i => i.src))); }
    catch { statusEl.textContent = "no entran más fotos en este navegador"; }
  }

  async function sumar(files){
    const lista = [...files].filter(f => f.type.startsWith("image/"));
    if (!lista.length) return;
    if (readOnly){ statusEl.textContent = "este muro es de solo lectura"; return; }

    for (let i = 0; i < lista.length; i++){
      statusEl.textContent = lista.length > 1 ? `revelando ${i+1} de ${lista.length}…` : "revelando…";
      let dataUrl;
      try { dataUrl = await revelar(lista[i]); }
      catch { statusEl.textContent = "esa foto no se pudo abrir"; continue; }

      const img = nuevaFoto(dataUrl);
      const pegar = () => {
        wallEl.prepend(img);
        if (!vacioEl.hidden) vacioEl.hidden = true;
      };

      if (shared){
        try { await shared.sync(pegar); }
        catch (err){
          const code = err && err.code;
          if (code === "not_writer" || code === "not_granted" || code === "not_declared"){
            soloLectura(); return;
          }
          statusEl.textContent = code === "too_large"
            ? "el muro está lleno — no entra otra foto"
            : "no se pudo guardar, probá de nuevo";
          return;
        }
      } else {
        pegar(); guardarLocal();
      }
    }
    statusEl.textContent = lista.length > 1 ? `${lista.length} fotos al muro` : "pegada";
    setTimeout(() => { statusEl.textContent = ""; }, 3200);
  }

  function soloLectura(){
    readOnly = true;
    dropEl.hidden = true;
    toCarga.hidden = true;
    statusEl.textContent = "";
    noteEl.textContent = "Este muro es de otra persona: podés mirarlo, pero no sumar fotos.";
  }

  /* ---- eventos ---- */
  dropEl.addEventListener("click", () => fileEl.click());
  fileEl.addEventListener("change", e => { sumar(e.target.files); fileEl.value = ""; });

  ["dragenter","dragover"].forEach(ev =>
    document.addEventListener(ev, e => { e.preventDefault(); if(!readOnly) dropEl.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev =>
    document.addEventListener(ev, e => { e.preventDefault(); dropEl.classList.remove("over"); }));
  document.addEventListener("drop", e => {
    if (e.dataTransfer && e.dataTransfer.files.length) sumar(e.dataTransfer.files);
  });

  document.addEventListener("claude:sync-off", () => {
    noteEl.textContent = "Se cortó la sincronización: lo que sumes ahora lo ves solo vos.";
  });

  /* ---- arranque ---- */
  (async () => {
    shared = (window.claude && window.claude.use) ? await window.claude.use("artifact") : null;

    if (shared){
      noteEl.textContent = "Lo que subas lo ve todo el que tenga el link del muro.";
      if (wallEl.children.length) vacioEl.hidden = true;
    } else {
      noteEl.textContent = "Sin muro compartido: las fotos quedan solo en este navegador.";
      const fotos = leerLocal();
      fotos.forEach(src => wallEl.append(nuevaFoto(src)));
      if (fotos.length) vacioEl.hidden = true;
    }
  })();
})();
</script>
